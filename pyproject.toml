[project]
name = "dashy-backend"
version = "0.1.0"
description = "Dashy Family Calendar - Backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "structlog>=26.1.0",
    "sqlmodel>=0.0.39",
    "alembic>=1.19.1",
    "aiosqlite>=0.22.1",
    "redis>=8.1.0",
    "greenlet>=3.5.5",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.1",
    "pytest-httpx>=0.36.2",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "D"]
ignore = ["B008"]  # Allow Depends() in default arguments (FastAPI pattern)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]  # Tests don't need docstrings

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Fast domain logic tests (no I/O)",
    "integration: Tests with real infrastructure (Redis, DB)",
    "api: HTTP endpoint tests",
    "slow: Tests that take >1 second",
]
